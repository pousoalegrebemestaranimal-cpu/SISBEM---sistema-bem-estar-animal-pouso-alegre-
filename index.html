
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISBEM - Sistema de Bem-Estar Animal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Aumentar um pouco o tamanho das fontes de todo o sistema */
        html {
            font-size: 16.8px; 
        }
        body { 
            font-family: 'Inter', sans-serif; 
        }
        
        /* Deixar as caixas de texto (inputs, textareas, selects) mais visíveis */
        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="time"],
        input[type="email"],
        input[type="password"],
        input[type="tel"],
        select,
        textarea {
            border: 1.5px solid #94a3b8 !important; /* Borda slate-400 de alta visibilidade */
            background-color: #ffffff !important; /* Fundo branco puro para excelente contraste */
            font-size: 0.925rem !important; /* Fonte um pouco maior para fácil digitação */
            color: #0f172a !important; /* Texto slate-900 super legível */
            border-radius: 0.75rem !important; /* Cantos arredondados elegantes */
            padding-top: 0.65rem !important;
            padding-bottom: 0.65rem !important;
            padding-left: 1rem !important;
            padding-right: 1rem !important;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out !important;
        }

        /* Melhorar visibilidade do placeholder */
        input::placeholder,
        textarea::placeholder {
            color: #64748b !important; /* slate-500 (mais escuro e visível) */
            opacity: 0.95 !important;
        }

        /* Efeito de foco de alta qualidade e nitidez */
        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus,
        input[type="time"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="tel"]:focus,
        select:focus,
        textarea:focus {
            border-color: #0d9488 !important; /* Cor Teal-600 */
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.25) !important;
            background-color: #ffffff !important;
            outline: none !important;
        }

        /* Estilos de Impressão de Alta Qualidade (Relatórios e Fichas) */
        @media print {
            .no-print,
            header,
            aside,
            .sidebar-container,
            button,
            nav {
                display: none !important;
            }

            body {
                background-color: #ffffff !important;
                color: #0f172a !important;
                font-size: 13pt !important;
                line-height: 1.5 !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            .pl-64 {
                padding-left: 0 !important;
            }

            main {
                max-width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .print-header {
                display: block !important;
            }

            .print-card {
                border: 1px solid #cbd5e1 !important;
                box-shadow: none !important;
                break-inside: avoid;
            }

            table {
                width: 100% !important;
                border-collapse: collapse !important;
            }

            th, td {
                border: 1px solid #cbd5e1 !important;
                padding: 6px 10px !important;
            }

            tr {
                break-inside: avoid;
            }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "date-fns/": "https://esm.sh/date-fns@^4.1.0/",
    "date-fns": "https://esm.sh/date-fns@^4.1.0",

    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
